[project]
name = "healthsync-mcp"
version = "0.1.0"
description = "Self-hosted Google Health dashboard and authenticated remote MCP."
requires-python = ">=3.11"
dependencies = ["healthsync", "mcp>=1.30,<2", "uvicorn>=0.35", "httpx>=0.28"]

[project.scripts]
hsync-server = "healthsync_mcp.app:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
healthsync = { path = "../cli", editable = true }

# Independent environment: installing the server does not change the CLI's lockfile.
[tool.uv.workspace]
members = []

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
